<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ますますプリントメーカー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#26364a;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}.app-header{padding:17px 20px;background:#fff;border-bottom:1px solid #dce7f0}.app-header h1{font-size:22px;margin:0}.app-header p{font-size:12px;margin:5px 0 0;color:#637487}.layout{display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr);gap:18px;padding:18px;align-items:start}.panel{background:white;border:1px solid #e0e9f2;border-radius:15px;padding:18px;box-shadow:0 3px 12px #24405c0b}.panel h2{font-size:17px;margin:0 0 15px}.field{margin-bottom:14px}.field>label,.field>span{display:block;font-weight:650;font-size:13px;margin-bottom:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,textarea,input[type=text]{width:100%;font:inherit;border:1px solid #cbd8e5;border-radius:9px;background:#fff;padding:10px;font-size:15px}textarea{resize:vertical;min-height:135px;line-height:1.6}.seg{display:flex;gap:5px;background:#eef4f9;border-radius:10px;padding:4px}.seg button{flex:1;border:0;border-radius:7px;background:transparent;padding:10px 4px;font-size:13px;font-weight:650;color:#5e7083}.seg button.active{background:#fff;color:#165c8b;box-shadow:0 1px 5px #253f5a21}.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}.check input{width:18px;height:18px}.hint{font-size:12px;color:#66788b;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}button.action{border:0;border-radius:10px;background:#176c9b;color:#fff;font-weight:700;padding:12px 6px;font-size:14px}button.action.secondary{background:#e9f3fa;color:#165d88}.preview-panel{min-width:0}.preview-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.preview-head h2{margin:0}.status{font-size:12px;color:#65778a}.pages{display:flex;flex-direction:column;align-items:center;gap:20px;overflow:auto;padding:16px 6px 28px;background:#e6edf4;border-radius:12px;max-height:calc(100vh - 140px)}.page{background:#fff;box-shadow:0 3px 13px #1a324b28;flex:none;position:relative;max-width:100%;overflow:hidden}.page svg{display:block;width:100%;height:100%}.paper-text{font-family:"UD Digi Kyokasho N-R","UD Digi Kyokasho NP-R","UD デジタル 教科書体 N-R","YuKyokasho","游教科書体","Hiragino Mincho ProN","Noto Serif CJK JP",serif}.print-only{display:none}.warning{font-size:12px;color:#9a570f;background:#fff6e7;padding:9px;border-radius:8px;margin:8px 0}.hidden{display:none!important}@media(max-width:800px){.layout{display:block;padding:10px}.panel{margin-bottom:12px}.pages{max-height:none}.app-header{padding:14px}.app-header h1{font-size:20px}}@media print{@page{margin:0;size:auto}html,body{background:#fff!important;margin:0!important;padding:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.app-header,.controls,.preview-head,.hint,.warning{display:none!important}.layout,.preview-panel,.panel,.pages{display:block!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;max-height:none!important;background:#fff!important}.page{box-shadow:none!important;margin:0!important;border:0!important;break-after:page;page-break-after:always;max-width:none!important;overflow:hidden!important}.page:last-child{break-after:auto;page-break-after:auto}.page svg{width:100%!important;height:100%!important}}
</style></head><body>
<header class="app-header"><h1>✏️ ますますプリントメーカー</h1><p>文字入り・白紙マスを自由に作成。印刷にもPDF保存にも。</p></header>
<main class="layout"><section class="panel controls"><h2>プリントの設定</h2>
<div class="field"><span>種類</span><div class="seg" id="modeButtons"><button type="button" data-mode="text" class="active">文字入り</button><button type="button" data-mode="blank">白紙マス</button></div></div>
<div class="two"><div class="field"><label for="paper">用紙サイズ</label><select id="paper"><option value="A4">A4（210×297mm）</option><option value="B5">B5（182×257mm）</option></select></div><div class="field"><label for="direction">文字の向き</label><select id="direction"><option value="vertical">縦書き</option><option value="horizontal">横書き</option></select></div></div>
<div class="two"><div class="field"><label for="size">マスの大きさ</label><select id="size"><option value="10">10mm</option><option value="12">12mm</option><option value="15" selected>15mm</option><option value="20">20mm</option></select></div><div class="field"><label for="guide">補助線</label><select id="guide"><option value="cross">十字リーダー</option><option value="none">なし</option></select></div></div>
<div class="field"><label for="heading">プリントの題名（任意）</label><input id="heading" type="text" placeholder="例：春の詩を書こう"></div>
<div id="textSettings"><div class="field"><label for="content">お手本にする文章</label><textarea id="content" spellcheck="false">春の朝\n小鳥がなく。</textarea><div class="hint">改行すると次の行・列に進みます。空白も1マス使用します。</div></div><label class="check"><input type="checkbox" id="showText" checked>文字のお手本を表示する</label></div>
<div class="field"><label for="blankPages">白紙マスのページ数</label><select id="blankPages"><option value="1">1ページ</option><option value="2">2ページ</option><option value="3">3ページ</option><option value="5">5ページ</option></select></div>
<div class="actions"><button type="button" class="action" id="print">印刷・PDF保存</button><button type="button" class="action secondary" id="reset">初期設定に戻す</button></div>
<p class="hint">iPad：［印刷・PDF保存］→ 印刷画面から共有／ファイルに保存。端末によって操作が異なります。</p>
<div class="warning">教科書体は端末にある場合に使用します。ない端末では日本語の代替フォントで表示されます。</div>
</section><section class="panel preview-panel"><div class="preview-head"><h2>印刷プレビュー</h2><span class="status" id="status">準備中…</span></div><div class="pages" id="pages"></div><p class="hint">プレビューは縮小表示です。実際の用紙寸法とマス目はmm単位で作成します。印刷時は倍率100%・余白なしを推奨します。</p></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),ids=['paper','direction','size','guide','heading','content','showText','blankPages'];let mode='text';const defaults={paper:'A4',direction:'vertical',size:'15',guide:'cross',heading:'',content:'春の朝\n小鳥がなく。',showText:true,blankPages:'1',mode:'text'};const ns='http://www.w3.org/2000/svg';const dim={A4:[210,297],B5:[182,257]};
function read(){const s={mode};for(const id of ids)s[id]=$(id).type==='checkbox'?$(id).checked:$(id).value;return s}
function save(){try{localStorage.setItem('masumasu-settings-v1',JSON.stringify(read()))}catch(e){}}
function load(){let v={};try{v=JSON.parse(localStorage.getItem('masumasu-settings-v1')||'{}')||{}}catch(e){};const s={...defaults,...v};mode=s.mode==='blank'?'blank':'text';for(const id of ids)$(id).type==='checkbox'?$(id).checked=!!s[id]:$(id).value=String(s[id]);setModeUI()}
function setModeUI(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('textSettings').classList.toggle('hidden',mode!=='text');$('blankPages').closest('.field').classList.toggle('hidden',mode!=='blank')}
function el(name,attrs={},text){const n=document.createElementNS(ns,name);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;return n}
function graphemes(t){if(Intl.Segmenter){return Array.from(new Intl.Segmenter('ja',{granularity:'grapheme'}).segment(t),x=>x.segment)}return Array.from(t)}
function charPlacement(ch,vertical){if(!vertical)return {ch,dx:0,dy:0,rotate:0};const replacements={'、':'︑','。':'︒','，':'︐','．':'︒','「':'﹁','」':'﹂','『':'﹃','』':'﹄','（':'︵','）':'︶','(':'︵',')':'︶','ー':'ー','…':'︙','‥':'︰','：':'︓','；':'︔','！':'︕','？':'︖'};if(ch==='ー')return {ch:'ー',dx:0,dy:0,rotate:90};return {ch:replacements[ch]||ch,dx:0,dy:0,rotate:0}}
function createPage(s,index,total,lines,geometry){const {w,h,cell,cols,rows,x0,y0,headerHeight}=geometry;const page=document.createElement('div');page.className='page';page.style.width=w+'mm';page.style.height=h+'mm';page.style.aspectRatio=w+'/'+h;const svg=el('svg',{xmlns:ns,viewBox:`0 0 ${w} ${h}`,width:w+'mm',height:h+'mm','aria-label':'プリント '+(index+1)+'ページ'});svg.appendChild(el('rect',{x:0,y:0,width:w,height:h,fill:'white'}));if(s.heading.trim()){const t=el('text',{x:w/2,y:12,'font-size':5.5,'text-anchor':'middle',fill:'#111','class':'paper-text'},s.heading.trim());svg.appendChild(t)}
const grid=el('g',{'shape-rendering':'geometricPrecision'});for(let c=0;c<=cols;c++)grid.appendChild(el('line',{x1:x0+c*cell,y1:y0,x2:x0+c*cell,y2:y0+rows*cell,stroke:'#555','stroke-width':0.18}));for(let r=0;r<=rows;r++)grid.appendChild(el('line',{x1:x0,y1:y0+r*cell,x2:x0+cols*cell,y2:y0+r*cell,stroke:'#555','stroke-width':0.18}));if(s.guide==='cross'){for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){let x=x0+c*cell,y=y0+r*cell;grid.appendChild(el('line',{x1:x+cell/2,y1:y,x2:x+cell/2,y2:y+cell,stroke:'#b4b4b4','stroke-width':0.12,'stroke-dasharray':'0.7 0.7'}));grid.appendChild(el('line',{x1:x,y1:y+cell/2,x2:x+cell,y2:y+cell/2,stroke:'#b4b4b4','stroke-width':0.12,'stroke-dasharray':'0.7 0.7'}))}}svg.appendChild(grid);
if(mode==='text'&&s.showText){const vertical=s.direction==='vertical';lines.forEach((line,lineIdx)=>{const chars=graphemes(line);chars.forEach((ch,pos)=>{if(ch===' '||ch==='　')return;const c=vertical?cols-1-lineIdx:pos,r=vertical?pos:lineIdx;if(c<0||r<0||c>=cols||r>=rows)return;const p=charPlacement(ch,vertical),x=x0+(c+.5)*cell,y=y0+(r+.5)*cell;const text=el('text',{x:x+p.dx,y:y+p.dy,'text-anchor':'middle','dominant-baseline':'central','font-size':cell*.72,fill:'#222','class':'paper-text'},p.ch);if(p.rotate)text.setAttribute('transform',`rotate(${p.rotate} ${x} ${y})`);svg.appendChild(text)})})}
page.appendChild(svg);return page}
function layoutText(text,capacity){const out=[];for(const raw of text.replace(/\r\n?/g,'\n').split('\n')){const arr=graphemes(raw);if(arr.length===0){out.push('');continue}for(let i=0;i<arr.length;i+=capacity)out.push(arr.slice(i,i+capacity).join(''))}return out.length?out:['']}
function render(){const s=read(),[w,h]=dim[s.paper],cell=Number(s.size),marginX=12,marginTop=s.heading.trim()?21:14,marginBottom=13,cols=Math.floor((w-2*marginX)/cell),rows=Math.floor((h-marginTop-marginBottom)/cell),x0=(w-cols*cell)/2,y0=marginTop+(h-marginTop-marginBottom-rows*cell)/2;const g={w,h,cell,cols,rows,x0,y0};const vertical=s.direction==='vertical';const charsPerLine=vertical?rows:cols,linesPerPage=vertical?cols:rows;let lines=mode==='text'?layoutText(s.content,charsPerLine):[];const count=mode==='blank'?Number(s.blankPages):Math.max(1,Math.ceil(lines.length/linesPerPage));const holder=$('pages');holder.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<count;i++){const subset=mode==='text'?lines.slice(i*linesPerPage,(i+1)*linesPerPage):[];frag.appendChild(createPage(s,i,count,subset,g))}holder.appendChild(frag);$('status').textContent=`${count}ページ・${cols}列 × ${rows}行`;save()}
function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}const rerender=debounce(render,120);for(const id of ids)$(id).addEventListener('input',rerender);document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;setModeUI();render()}));$('reset').addEventListener('click',()=>{mode=defaults.mode;for(const id of ids)$(id).type==='checkbox'?$(id).checked=defaults[id]:$(id).value=defaults[id];setModeUI();render()});$('print').addEventListener('click',()=>{render();window.print()});load();render();
})();
</script></body></html>
